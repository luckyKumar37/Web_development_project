<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Convertor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="header">
        <h1>Metric/Imperial Unit Conversion</h1>
        <input type="text" id="input_el">
        <button id="btn">convert</button>
        <p id="error_message"></p>
    </div>
    <div id="container">
        <div class="data_container">
            <h2>Length (Meter/Feet)</h3>
            <p id="length_info"></p>
        </div>
        <div class="data_container">
            <h2>Volume (Liters/Gallons)</h3>
            <p id="volume_info"></p>
        </div>
        <div class="data_container">
            <h2>Mass (Kilograms/Pounds)</h3>
            <p id="mass_info"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
